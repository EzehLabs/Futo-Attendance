services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-futo_attendance}
      MYSQL_USER: ${MYSQL_USER:-futoapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-futoapp_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-futo_attendance}
      DB_USER: ${MYSQL_USER:-futoapp}
      DB_PASS: ${MYSQL_PASSWORD:-futoapp_local_password}
      SESSION_NAME: futo_session
      SYNC_API_KEY: ${SYNC_API_KEY:-change-this-key}
    ports:
      - "127.0.0.1:8000:80"

volumes:
  mysql_data:
